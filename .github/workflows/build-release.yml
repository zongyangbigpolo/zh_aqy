name: Build Cross-Platform Release Package

permissions:
  contents: write

on:
  push:
    branches:
      - main
      - feature/cross-platform-deployment
    tags:
      - "v*"
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 8
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "8"
          cache: maven

      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Build backend
        run: mvn -B clean package -DskipTests

      - name: Install frontend dependencies
        working-directory: aqy-ui
        run: |
          set -o pipefail
          {
            node -v
            npm -v
            npm install --legacy-peer-deps --no-audit --no-fund
          } 2>&1 | tee ../frontend-build.log

      - name: Build frontend
        working-directory: aqy-ui
        env:
          CI: "false"
          NODE_OPTIONS: "--max-old-space-size=4096 --openssl-legacy-provider"
        run: |
          set -o pipefail
          echo "NODE_OPTIONS=${NODE_OPTIONS}" | tee -a ../frontend-build.log
          if ! npm run build:prod 2>&1 | tee -a ../frontend-build.log; then
            echo "::group::Frontend build log tail"
            tail -120 ../frontend-build.log
            echo "::endgroup::"
            python3 - <<'PY'
          from pathlib import Path
          lines = Path("../frontend-build.log").read_text(errors="replace").splitlines()[-30:]
          message = "\n".join(lines)
          message = message.replace("%", "%25").replace("\r", "%0D").replace("\n", "%0A")
          print(f"::error title=Frontend build failed::{message}")
          PY
            exit 1
          fi
          test -f dist/index.html

      - name: Upload frontend build log
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: frontend-build-log
          path: frontend-build.log

      - name: Assemble cross-platform package
        shell: bash
        run: |
          set -euo pipefail
          RAW_VERSION="${GITHUB_REF_NAME}-${GITHUB_SHA::7}"
          VERSION="${RAW_VERSION//\//-}"
          PACKAGE_DIR="zh-aqy-cross-platform-${VERSION}"
          mkdir -p "${PACKAGE_DIR}/server" "${PACKAGE_DIR}/web" "${PACKAGE_DIR}/bin" "${PACKAGE_DIR}/sql"
          cp aqy-admin/target/aqy-admin.jar "${PACKAGE_DIR}/server/aqy-admin.jar"
          cp -R aqy-ui/dist/. "${PACKAGE_DIR}/web/"
          cp bin/windows-upgrade.ps1 "${PACKAGE_DIR}/bin/windows-upgrade.ps1"
          cp bin/windows-preflight-check.ps1 "${PACKAGE_DIR}/bin/windows-preflight-check.ps1"
          cp bin/windows-install-prerequisites.ps1 "${PACKAGE_DIR}/bin/windows-install-prerequisites.ps1"
          cp bin/deploy-release.ps1 "${PACKAGE_DIR}/bin/deploy-release.ps1"
          cp bin/windows-fresh-test-deploy.ps1 "${PACKAGE_DIR}/bin/windows-fresh-test-deploy.ps1"
          cp bin/RUN-CHECK-WINDOWS-ENV.bat "${PACKAGE_DIR}/bin/RUN-CHECK-WINDOWS-ENV.bat"
          cp bin/RUN-INSTALL-WINDOWS-PREREQS.bat "${PACKAGE_DIR}/bin/RUN-INSTALL-WINDOWS-PREREQS.bat"
          cp bin/RUN-FRESH-WINDOWS-TEST.bat "${PACKAGE_DIR}/bin/RUN-FRESH-WINDOWS-TEST.bat"
          cp bin/RUN-UPGRADE-EXISTING-WINDOWS.bat "${PACKAGE_DIR}/bin/RUN-UPGRADE-EXISTING-WINDOWS.bat"
          cp bin/RUN-DOCKER-FRESH-TEST.bat "${PACKAGE_DIR}/bin/RUN-DOCKER-FRESH-TEST.bat"
          cp bin/RUN-DOCKER-FRESH-TEST.sh "${PACKAGE_DIR}/bin/RUN-DOCKER-FRESH-TEST.sh"
          cp bin/RUN-DOCKER-FRESH-TEST.command "${PACKAGE_DIR}/bin/RUN-DOCKER-FRESH-TEST.command"
          cp bin/docker-generate-env.sh "${PACKAGE_DIR}/bin/docker-generate-env.sh"
          cp bin/docker-generate-env.ps1 "${PACKAGE_DIR}/bin/docker-generate-env.ps1"
          cp bin/unix-common.sh "${PACKAGE_DIR}/bin/unix-common.sh"
          cp bin/unix-preflight-check.sh "${PACKAGE_DIR}/bin/unix-preflight-check.sh"
          cp bin/unix-install-prerequisites.sh "${PACKAGE_DIR}/bin/unix-install-prerequisites.sh"
          cp bin/unix-fresh-test-deploy.sh "${PACKAGE_DIR}/bin/unix-fresh-test-deploy.sh"
          cp bin/unix-upgrade-existing.sh "${PACKAGE_DIR}/bin/unix-upgrade-existing.sh"
          cp bin/RUN-UBUNTU-CHECK-ENV.sh "${PACKAGE_DIR}/bin/RUN-UBUNTU-CHECK-ENV.sh"
          cp bin/RUN-UBUNTU-INSTALL-PREREQS.sh "${PACKAGE_DIR}/bin/RUN-UBUNTU-INSTALL-PREREQS.sh"
          cp bin/RUN-UBUNTU-FRESH-TEST.sh "${PACKAGE_DIR}/bin/RUN-UBUNTU-FRESH-TEST.sh"
          cp bin/RUN-UBUNTU-UPGRADE-EXISTING.sh "${PACKAGE_DIR}/bin/RUN-UBUNTU-UPGRADE-EXISTING.sh"
          cp bin/RUN-MACOS-CHECK-ENV.command "${PACKAGE_DIR}/bin/RUN-MACOS-CHECK-ENV.command"
          cp bin/RUN-MACOS-INSTALL-PREREQS.command "${PACKAGE_DIR}/bin/RUN-MACOS-INSTALL-PREREQS.command"
          cp bin/RUN-MACOS-FRESH-TEST.command "${PACKAGE_DIR}/bin/RUN-MACOS-FRESH-TEST.command"
          cp bin/RUN-MACOS-UPGRADE-EXISTING.command "${PACKAGE_DIR}/bin/RUN-MACOS-UPGRADE-EXISTING.command"
          cp sql/zh_aqy_schema.sql "${PACKAGE_DIR}/sql/zh_aqy_schema.sql"
          cp sql/ry_20240629.sql "${PACKAGE_DIR}/sql/ry_20240629.sql"
          cp sql/quartz.sql "${PACKAGE_DIR}/sql/quartz.sql"
          cp docker-compose.yml "${PACKAGE_DIR}/docker-compose.yml"
          cp .dockerignore "${PACKAGE_DIR}/.dockerignore"
          mkdir -p "${PACKAGE_DIR}/deploy"
          cp -R deploy/docker "${PACKAGE_DIR}/deploy/docker"
          cp README.md "${PACKAGE_DIR}/README.md"
          chmod +x "${PACKAGE_DIR}"/bin/*.sh "${PACKAGE_DIR}"/bin/*.command "${PACKAGE_DIR}"/deploy/docker/mysql-init/*.sh
          cat > "${PACKAGE_DIR}/START-HERE.txt" <<'EOF'
          Zh_AqY cross-platform release package

          Recommended modern fresh-test path on Windows/Ubuntu/macOS:
          1. Install Docker Desktop or Docker Engine with Compose plugin.
          2. Run:
             Windows: .\bin\RUN-DOCKER-FRESH-TEST.bat
             Ubuntu : ./bin/RUN-DOCKER-FRESH-TEST.sh
             macOS  : double-click bin/RUN-DOCKER-FRESH-TEST.command
          3. Open http://127.0.0.1:8080/
          4. Login with admin / ChangeMe@123456 and change the password immediately.

          Windows existing-server upgrade:
          1. Back up the existing MySQL database first.
          2. Extract this package to any temporary folder.
          3. Run .\bin\RUN-CHECK-WINDOWS-ENV.bat and configure any missing items.
          4. Double-click .\bin\RUN-UPGRADE-EXISTING-WINDOWS.bat

          Windows fresh test machine:
          1. Install Java 8, MySQL, Redis, and optionally nginx.
             You can double-click .\bin\RUN-INSTALL-WINDOWS-PREREQS.bat for help.
          2. Run .\bin\RUN-CHECK-WINDOWS-ENV.bat to confirm the machine is ready.
          3. Double-click .\bin\RUN-FRESH-WINDOWS-TEST.bat

          Ubuntu fresh test machine:
          1. Run ./bin/RUN-UBUNTU-INSTALL-PREREQS.sh if Java 8/MySQL/Redis are missing.
          2. Run ./bin/RUN-UBUNTU-CHECK-ENV.sh.
          3. Run ./bin/RUN-UBUNTU-FRESH-TEST.sh.

          Ubuntu existing-server upgrade:
          1. Back up MySQL first.
          2. Run ./bin/RUN-UBUNTU-CHECK-ENV.sh and configure missing items.
          3. Run ./bin/RUN-UBUNTU-UPGRADE-EXISTING.sh.

          macOS fresh test machine:
          1. Double-click bin/RUN-MACOS-INSTALL-PREREQS.command if Java 8/MySQL/Redis are missing.
          2. Double-click bin/RUN-MACOS-CHECK-ENV.command.
          3. Double-click bin/RUN-MACOS-FRESH-TEST.command.

          macOS existing test upgrade:
          1. Back up MySQL first.
          2. Double-click bin/RUN-MACOS-CHECK-ENV.command.
          3. Double-click bin/RUN-MACOS-UPGRADE-EXISTING.command.

          Existing-server upgrade scripts do not delete, recreate, or modify your existing MySQL database.
          The fresh-test script imports initialization SQL only for empty/disposable test databases.
          Do not run fresh-test scripts on an existing production/old server.
          EOF
          zip -r "${PACKAGE_DIR}.zip" "${PACKAGE_DIR}"
          tar -czf "${PACKAGE_DIR}.tar.gz" "${PACKAGE_DIR}"

      - name: Upload cross-platform package
        uses: actions/upload-artifact@v4
        with:
          name: zh-aqy-cross-platform-package
          path: |
            zh-aqy-cross-platform-*.zip
            zh-aqy-cross-platform-*.tar.gz

      - name: Create GitHub release for version tags
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            zh-aqy-cross-platform-*.zip
            zh-aqy-cross-platform-*.tar.gz
