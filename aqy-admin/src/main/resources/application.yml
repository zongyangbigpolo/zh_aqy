# 项目相关配置
ruoyi:
  # 名称
  name: Zh_AqY
  # 版本
  version: 3.8.8
  # 版权年份
  copyrightYear: 2024
  # 文件路径 示例（ Windows配置D:/aqy/uploadPath，Linux配置 /home/aqy/uploadPath）
  profile: ${RUOYI_PROFILE:D:/aqy/uploadPath}
  # 获取ip地址开关
  addressEnabled: false
  # 验证码类型 math 数字计算 char 字符验证
  captchaType: math
mqtt:
  consumerEnabled: ${MQTT_CONSUMER_ENABLED:true}
  host:
    - ${MQTT_HOST:}
  username: ${MQTT_USERNAME:}
  password: ${MQTT_PASSWORD:}
  #设置是否清空session,这里如果设置为false表示服务器会保留客户端的连接记录，
  #这里设置为true表示每次连接到服务器都以新的身份连接
  cleanSession: true
  #是否自动重连
  autoReconnect: true
  #心跳间隔
  keepAliveInterval: 10
  #连接超时
  connectionTimeout: 10
  #断开连接超时时间
  completionTimeout: 10000
  #消息质量
  qos: 1
  #  MQTT 生产者
  # 连接服务器默认客户端ID
  producerClientId: mqttClient01
  # 默认的推送主题，实际可在调用接口时指定
  producerDefaultTopic: topic1
  #  MQTT 消费者
  # 连接服务器默认客户端ID
  consumerClientId: mqttConsumer1
  # 默认的接收主题，可以订阅多个Topic
  # /api/v1/+/mqtt/dataResp表示将匹配以 /api/v1/ 为前缀、接下来的层级是任意字符串（不包含 /）、最后以 /mqtt/dataResp 结尾的所有主题
  consumerDefaultTopic:
    - $send/+/+ # 表示平台下发的远程命令主题
    - $reply/+/+ # 表示设备回复平台下发指令主题
    - $send/+/firmware # 表示固件升级主题，平台将固件升级包拆分小的数据包后通过此主题下发给设备
    - $reply/+/firmware # 表示固件升级结果回复的主题
    - $data/+/raw # 表示设备原始数据上传主题
    - $devstatus # 表示设备状态上传主题
    - $request/+/getCurrentTime # 智能网关获取当前时间
    - $response/+/getCurrentTime # 智能网关获取当前时间
  #遗嘱消息配置
  willTopic: testmqttwill
  willContent: mqttServer Unexpected disconnection
  willQos: 1
  willRetained: true

# 开发环境配置
server:
  # 服务器的HTTP端口，默认为8080
  port: ${SERVER_PORT:7070}
  servlet:
    # 应用的访问路径
    context-path: ${SERVER_CONTEXT_PATH:/prod-api}
  tomcat:
    # tomcat的URI编码
    uri-encoding: UTF-8
    # 连接数满后的排队数，默认为100
    accept-count: 1000
    threads:
      # tomcat最大线程数，默认为200
      max: 800
      # Tomcat启动初始化的线程数，默认值10
      min-spare: 100

# 日志配置
logging:
  level:
    com.ruoyi: ${LOG_LEVEL_RUOYI:info}
    org.springframework: warn

# 用户配置
user:
  password:
    # 密码最大错误次数
    maxRetryCount: 5
    # 密码锁定时间（默认10分钟）
    lockTime: 10

# Spring配置
spring:
  # 资源信息
  messages:
    # 国际化资源文件路径
    basename: i18n/messages
  profiles:
    active: druid
  # 文件上传
  servlet:
    multipart:
      # 单个文件大小
      max-file-size: 10MB
      # 设置总上传的文件大小
      max-request-size: 20MB
  # 服务模块
  devtools:
    restart:
      # 热部署开关
      enabled: true
  # redis 配置
  redis:
    # 地址
    host: ${REDIS_HOST:localhost}
    # 端口，默认为6379
    port: ${REDIS_PORT:6379}
    # 数据库索引
    database: ${REDIS_DATABASE:0}
    # 密码
    password: ${REDIS_PASSWORD:}
    # 连接超时时间
    timeout: 10s
    lettuce:
      pool:
        # 连接池中的最小空闲连接
        min-idle: 0
        # 连接池中的最大空闲连接
        max-idle: 8
        # 连接池的最大数据库连接数
        max-active: 8
        # #连接池最大阻塞等待时间（使用负值表示没有限制）
        max-wait: -1ms

# token配置
token:
  # 令牌自定义标识
  header: Authorization
  # 令牌密钥
  secret: ${TOKEN_SECRET:}
  # 令牌有效期（默认30分钟）
  expireTime: 30

# MyBatis配置
mybatis:
  # 搜索指定包别名
  typeAliasesPackage: com.ruoyi.**.domain
  # 配置mapper的扫描，找到所有的mapper.xml映射文件
  mapperLocations: classpath*:mapper/**/*Mapper.xml
  # 加载全局的配置文件
  configLocation: classpath:mybatis/mybatis-config.xml

# PageHelper分页插件
pagehelper:
  helperDialect: mysql
  supportMethodsArguments: true
  params: count=countSql

# OpenAPI/Swagger 接口文档默认关闭，生产环境不要匿名暴露
springdoc:
  api-docs:
    enabled: ${SWAGGER_ENABLED:false}
  swagger-ui:
    enabled: ${SWAGGER_ENABLED:false}

swagger:
  enabled: ${SWAGGER_ENABLED:false}
  # 请求前缀
  pathMapping: /dev-api

# 防止XSS攻击
xss:
  # 过滤开关
  enabled: true
  # 排除链接（多个用逗号分隔）
  excludes: /system/notice
  # 匹配链接
  urlPatterns: /system/*,/monitor/*,/tool/*

aliyun:
  sms:
    accessKeyId: ${ALIYUN_SMS_ACCESS_KEY_ID:}
    accessKeySecret: ${ALIYUN_SMS_ACCESS_KEY_SECRET:}
    signName: ${ALIYUN_SMS_SIGN_NAME:}
    templateCode: ${ALIYUN_SMS_TEMPLATE_CODE:}
    cooldownSeconds: ${ALIYUN_SMS_COOLDOWN_SECONDS:600}

# 本地文件上传
file:
    domain: ${FILE_DOMAIN:http://127.0.0.1:7070}
    path: ${FILE_UPLOAD_PATH:D:/aqy/uploadPath}
    prefix: ${FILE_PREFIX:/zhbg}

#  domain: http://112.31.46.223:65521
#  path: E:/minio/data/aqy
#  prefix: /aqy